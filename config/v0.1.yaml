# Canonical v0.1 experiment configuration.  # Update version number.

project:
  name: fyp-citizen-science-dq
  version: v0.1  # Update version number.

species:
  common_name: Raffles' Banded Langur
  scientific_name: Presbytis femoralis

knowledge_source:
  name: Wikipedia
  url: https://en.wikipedia.org/wiki/Raffles%27_banded_langur

dataset:
  platform: iNaturalist
  api_base_url: https://api.inaturalist.org/v1
  input_path: data/raw/occurrences.csv
  fetch:
    total_records: 250
  schema:
    id: inaturalist-observation-v1-normalized
    description: Normalized occurrence fields used by v0.1 oracles.  # Update version number.
    fields:
      - name: observation_id
        type: integer
        description: iNaturalist observation identifier.
        source: id
      - name: taxon_name
        type: string
        description: Scientific name attached to the observation.
        source: taxon.name
      - name: latitude
        type: number
        description: Decimal latitude in WGS84.
        source: geojson.coordinates[1]
      - name: longitude
        type: number
        description: Decimal longitude in WGS84.
        source: geojson.coordinates[0]
      - name: observed_on
        type: date
        description: Observation date supplied by the observer.
        source: observed_on
      - name: quality_grade
        type: string
        description: iNaturalist observation quality grade.
        source: quality_grade
      - name: observer_login
        type: string
        description: iNaturalist observer login.
        source: user.login
      - name: observation_url
        type: string
        description: Public iNaturalist observation URL.
        source: id
        transform: observation_url

oracle_generation:
  model: openai/gpt-oss-20b
  max_output_tokens: 4096
  base_url: https://api.groq.com/openai/v1
  api_key_env: LLM_API_KEY
  prompt_path: prompts/oracle_v0.1.md  # Update version number.
  output_path: experiments/runs/v0.1/generated_oracle.py  # Update version number.

qc:
  oracle_path: experiments/runs/v0.1/generated_oracle.py  # Update version number.
  output_path: experiments/runs/v0.1/flagged_records.csv  # Update version number.
